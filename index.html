<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <header>
        <h1>Sorting Visualizer</h1>
    </header>
    <div class="sub-heading">
        <div class="new-array-div">
            <button id="new-array">new array</button>
        </div>

        <div class="size-container">
            <p id="size-title">size of the array</p>
            <input type="range" min="10" max="50" step="1" value="30" id="size-slider">
            <div class="size-map">
                <p>10</p>
                <p>20</p>
                <p>30</p>
                <p>40</p>
                <p>50</p>
            </div>
        </div>

        <div class="speed-container">
            <p id="speed-title">algorithm speed control</p>
            <input type="range" min="1" max="5" step="1" value="3" id="speed-slider">
            <div class="speed-map">
                <p>min</p>
                <p>med</p>
                <p>max</p>
            </div>
        </div>

        <div class="pause-play">
            <button class="pause-play-button"><i class="fa-solid fa-pause"></i></button>
            <div class="pause-play-status">pause</div>
        </div>

        <div class="sorting-methods-div">
            <button class="sorting-methods" id="bubbleSort">Bubble Sort</button>
            <button class="sorting-methods" id="insertionSort">Insertion Sort</button>
            <button class="sorting-methods" id="selectionSort">Selection Sort</button>
            <button class="sorting-methods" id="quickSort">Quick Sort</button>
            <button class="sorting-methods" id="mergeSort">Merge Sort</button>
        </div>
    </div>
    <div class="heights">

    </div>
    <div class="optInfo">
        <div class="timeComplexity">
            <div class="TCtext">
                Time Complexity
            </div>
            <div class="timeComplexity-value">
                -
            </div>
        </div>
        <div class="spaceComplexity">
            <div class="SCtext">
                Space Complexity
            </div>
            <div class="spaceComplexity-value">
                -
            </div>
        </div>
        <div class="time">
            <div class="time-text">
                Time
            </div>
            <div class="time-seconds">
                0.00s
            </div>
        </div>
    </div>

    <div class="graph-container">
        <div class="about-graph">
            Note about graph
        </div>
        <div class="graph">
            <div class="axis">
                <div class="time-text-graph">
                    <p>T</p>
                    <p>I</p>
                    <p>M</p>
                    <p>E</p>
                </div>
                <div class="time-values">
                    <p>100</p>
                    <p>90</p>
                    <p>80</p>
                    <p>70</p>
                    <p>60</p>
                    <p>50</p>
                    <p>40</p>
                    <p>30</p>
                    <p>20</p>
                    <p>10</p>
                    <p>0</p>
                </div>
                <div class="axis-box">

                </div>
            </div>
        </div>
    </div>



    <script src="sorting.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="more_options.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="menu-overlay"></div>

    <div class="side-menu">

        <div class="side-bar-header">
            <button class="close-button"><i class="fa-solid fa-arrow-left"></i></button>
            <h1>D.S.A. Visualizer</h1>
        </div>

        <div class="side-menu-distinction-line"></div>

        <div class="menu-options">
            <button>Main Menu</button>
            <button>Arrays</button>
            <button>Linked Lists</button>
            <button>Sorting Algorithms</button>
            <button>Trees</button>
            <button id="graph-menu-btn">Graphs</button>
            <button>About Us</button>
        </div>

    </div>

    <header>
        <h1>Sorting Visualizer</h1>
        <button class="more-button"><i class="fa-solid fa-bars"></i></button>
    </header>
    <div class="sub-heading">
        <div class="new-array-div">
            <button id="new-array"><i class="fa-solid fa-repeat"></i></button>
        </div>

        <div class="size-container">
            <p id="size-title">Size : 30</p>
            <input type="range" min="10" max="50" step="1" value="30" id="size-slider">
        </div>

        <div class="speed-container">
            <p id="speed-title">Speed : 100ms</p>
            <input type="range" min="1" max="5" step="1" value="3" id="speed-slider">
            <!-- <div class="speed-map">
                <p>min</p>
                <p>med</p>
                <p>max</p>
            </div> -->
        </div>

        <div class="pause-play">

            <button class="pause-play-button"><i class="fa-regular fa-circle-pause"></i></button>
            <!-- <div class="pause-play-status">pause</div> -->
        </div>

        <div class="sorting-methods-div">
            <button class="sorting-methods" id="bubbleSort">Bubble Sort</button>
            <button class="sorting-methods" id="insertionSort">Insertion Sort</button>
            <button class="sorting-methods" id="selectionSort">Selection Sort</button>
            <button class="sorting-methods" id="quickSort">Quick Sort</button>
            <button class="sorting-methods" id="mergeSort">Merge Sort</button>
        </div>
    </div>

    <div class="heights-container">

        <div class="heights">

        </div>

    </div>

    <div class="optInfo">

        <div class="timeComplexity">
            <div class="TCtext">
                Time Complexity
            </div>
            <div class="timeComplexity-value">
                <div class="best-case">
                    <div class="best-case-text">
                        Best Case
                    </div>
                    <div class="best-case-value">
                        -
                    </div>
                </div>
                <div class="avg-case">
                    <div class="avg-case-text">
                        Average Case
                    </div>
                    <div class="avg-case-value">
                        -
                    </div>
                </div>
                <div class="worst-case">
                    <div class="worst-case-text">
                        Worst Case
                    </div>
                    <div class="worst-case-value">
                        -
                    </div>
                </div>
            </div>
        </div>

        <div class="spaceComplexity">
            <div class="SCtext">
                Space Complexity
            </div>
            <div class="spaceComplexity-value">
                -
            </div>
        </div>

        <div class="time">
            <div class="time-text">
                Time
            </div>
            <div class="time-value">
                0.00s
            </div>
        </div>


    </div>

    <div class="graph-container">
        <div class="about-graph">
            Note about graph
        </div>
        <div class="graph">
            <!-- <div class="graph-time-text">

                <p>Time (in seconds) <i class="fa-solid fa-arrow-right-long"></i></p>

                <div class="graph-time-values">
                    <p>0</p>
                    <p>10</p>
                    <p>20</p>
                    <p>30</p>
                    <p>40</p>
                    <p>50</p>
                    <p>60</p>
                    <p>70</p>
                    <p>80</p>
                    <p>90</p>
                    <p>100</p>
                </div>
            </div> -->

            <div class="axis">
                <div class="allSortingNames">
                    <p>Bubble Sort</p>
                    <p>Insertion Sort</p>
                    <p>Selection Sort</p>
                    <p>Quick Sort</p>
                    <p>Merge Sort</p>
                </div>

                <div class="axis-box">
                    <div class="pre-bubble-sort-bar pre-bar">

                    </div>
                    <div class="pre-insertion-sort-bar pre-bar">

                    </div>
                    <div class="pre-selection-sort-bar pre-bar">

                    </div>
                    <div class="pre-quick-sort-bar pre-bar">

                    </div>
                    <div class="pre-merge-sort-bar pre-bar">

                    </div>

                </div>

            </div>
        </div>
    </div>

    <div class=".documentation-container">

    </div>


    <script src="sorting.js"></script>
    <script src="more_options.js"></script>
</body>

</html>
